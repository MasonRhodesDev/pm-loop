[project]
name = "gh-bot"
version = "0.1.0"
description = "MCP server: every GitHub write as a GitHub App, role line on every record, merge gated by CLEAR+green"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "pyjwt[crypto]>=2.8"]
[project.scripts]
gh-bot = "gh_bot.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["gh_bot"]
